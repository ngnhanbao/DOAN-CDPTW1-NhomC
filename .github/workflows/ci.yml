name: CI/CD Pipeline - Hotel Management

on:
  push:
    branches: [ "main", "master", "ThuTrang/*", "NhanBao/*", "VanHa/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. Kiểm tra build ứng dụng Backend & Frontend
  test-and-build:
    name: Build & Test Applications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install Backend
        run: |
          cd backend
          npm install

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

  # 2. Kiểm tra Docker Build & Docker Compose
  docker-validation:
    name: Validate Docker Containers
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build
